<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic HTML Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #222;
      background: #f5f7fb;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      border: 1px solid #d8dee9;
      border-radius: 8px;
      padding: 24px;
    }

    a {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <header>
    <h1>Basic HTML Site</h1>
    <p>A simple page running from this repo.</p>
  </header>

  <main>
    <section>
      <h2>Hello</h2>
      <p>This is a basic HTML page with a little CSS.</p>
      <p>Edit <code>index.html</code> to change the content.</p>
    </section>
  </main>
</body>
</html>
