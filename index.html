<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #9a9a9a;
        color: #3a3a3a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #9a9a9a;
      }

      main {
        width: min(90vw, 560px);
        padding: 48px;
        text-align: center;
        background: #c8c8c8;
        border: 1px solid #7f7f7f;
        border-radius: 8px;
        box-shadow: 0 24px 60px rgb(70 70 70 / 24%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
        color: #2f2f2f;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
        color: #555;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>A simple grey landing page.</p>
    </main>
  </body>
</html>
