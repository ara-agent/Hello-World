<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #4f8f5c;
        color: #17351f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #4f8f5c;
      }

      main {
        width: min(90vw, 560px);
        padding: 48px;
        text-align: center;
        background: #b7d9bd;
        border: 1px solid #3f754a;
        border-radius: 8px;
        box-shadow: 0 24px 60px rgb(21 71 32 / 24%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
        color: #12301a;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
        color: #24482b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>A simple green landing page.</p>
    </main>
  </body>
</html>
