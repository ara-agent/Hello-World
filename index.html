<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18202a;
        --muted: #53606f;
        --paper: #f7f3ea;
        --accent: #237c6d;
        --accent-dark: #16564c;
        --line: #d9d0c1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(35, 124, 109, 0.12), transparent 38%),
          var(--paper);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .panel {
        width: min(100%, 720px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        padding: clamp(28px, 6vw, 56px);
        box-shadow: 0 24px 70px rgba(24, 32, 42, 0.12);
      }

      p.kicker {
        margin: 0 0 14px;
        color: var(--accent-dark);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6.5rem);
        line-height: 0.95;
      }

      p.copy {
        max-width: 560px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 32px;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        padding: 0 18px;
        text-decoration: none;
      }

      a:focus,
      a:hover {
        background: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="page-title">
        <p class="kicker">Static HTML</p>
        <h1 id="page-title">Hello, world.</h1>
        <p class="copy">
          A tiny single-file website served locally from this repository.
        </p>
        <a href="https://github.com/ara-agent/Hello-World">View project</a>
      </section>
    </main>
  </body>
</html>
